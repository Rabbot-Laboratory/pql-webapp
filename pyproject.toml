[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highend-control-server"
version = "0.1.0"
description = "Browser-first control server for the air-compressor robot."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyserial>=3.5,<4.0",
    # zoneinfo tz database for platforms without a system one (control_service
    # stamps logs in Asia/Tokyo).
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
    # Required by fastapi/starlette TestClient in the API tests.
    "httpx>=0.27,<1.0",
]
pi-sensors = [
    "evdev>=1.7,<2.0",
    "smbus2>=0.5,<1.0",
    "spidev>=3.6,<4.0",
]
simulation = [
    "mujoco>=3.3,<4.0",
    "numpy>=1.26,<3.0",
]
# Dev-machine only: SSH deploy/log-fetch to the robot's Raspberry Pi.
deploy = [
    "paramiko>=3.0,<5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/highend_server/api/routes.py" = ["B008"]  # FastAPI Depends() in defaults is idiomatic
